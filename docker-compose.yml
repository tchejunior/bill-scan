services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recibo42
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: recibo42
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recibo42"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8000"
    env_file: .env
    secrets:
      - secret_key
      - anthropic_api_key
    volumes:
      - receipt_images:/var/data/recibo42
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    user: "1000:1000"
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    secrets:
      - secret_key
      - anthropic_api_key
    volumes:
      - receipt_images:/var/data/recibo42
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  receipt_images:

secrets:
  secret_key:
    file: /home/jarvis/secrets/recibo42_secret_key
  anthropic_api_key:
    file: /home/jarvis/secrets/anthropic_api_key
