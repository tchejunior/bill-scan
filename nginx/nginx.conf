server {
    listen 80;
    server_name recibo42.com.br www.recibo42.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name recibo42.com.br www.recibo42.com.br;

    ssl_certificate /etc/letsencrypt/live/recibo42.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recibo42.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /var/www/recibo42;
        try_files $uri $uri/ /index.html;
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    access_log /var/log/nginx/recibo42_access.log;
    error_log  /var/log/nginx/recibo42_error.log warn;
}
